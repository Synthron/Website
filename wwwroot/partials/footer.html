<footer class="site-footer">
  <div class="container site-footer__inner">
    <nav class="site-footer__nav" aria-label="{{t:footerNavLabel}}">
      <!-- @footer-nav -->
      <a class="site-footer__feed" href="{{feedHref}}" type="application/rss+xml"><img class="site-footer__feed-icon" src="{{root}}assets/icons/feed-icon.webp" alt="{{t:feedLink}}" width="20" height="20" loading="lazy" decoding="async"></a>
    </nav>
    <div class="site-footer__info">
      <p>© {{year}} {{name}}</p>
      <p>{{footerNote}}</p>
    </div>
  </div>
</footer>
