<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="All projects by {name} (placeholder).">
  <title>Projects — {name}</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script type="module" src="../js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-brand" data-site-brand href="../index.html"></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>Menu</button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="../index.html">Home</a></li>
          <li><a class="site-nav__link" href="projects.html" aria-current="page">Projects</a></li>
          <li><a class="site-nav__link" href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="site-main" id="main">
    <div class="container">
      <header class="page-header">
        <h1>Projects</h1>
        <p class="page-header__lead">All projects, newest first. Filter by tag to narrow the list.</p>
      </header>

      <div class="tag-filter" role="group" aria-label="Filter by tag" data-tag-filter="project-list"></div>
      <p class="filter-status" role="status" data-filter-status="project-list"></p>

      <div class="project-grid" id="project-list" data-projects="all" data-heading-level="2">
        <noscript><p class="message">Enable JavaScript to view the project list.</p></noscript>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p data-site-copyright></p>
      <p data-site-note>No cookies. No tracking.</p>
    </div>
  </footer>
</body>
</html>
